name: Sync wiki

# Source of truth for the GitHub Wiki is the wiki/ folder in this repo, not
# the wiki's own git history. Any merged change to wiki/*.md (whether from a
# human PR or the AI FAQ drafter) gets mirrored here as a plain, deterministic
# file copy — no AI involved in this step.
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Check Wiki feature is enabled
        id: wiki_enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          HAS_WIKI=$(gh api repos/${{ github.repository }} --jq '.has_wiki')
          echo "has_wiki=$HAS_WIKI" >> "$GITHUB_OUTPUT"
          if [ "$HAS_WIKI" != "true" ]; then
            echo "::notice::Wiki feature is off for this repo (paid-plan gate on private repos, or just not toggled on yet). Skipping sync — wiki/*.md in this repo is the source of truth in the meantime, see wiki/Home.md."
          fi

      - name: Checkout (or initialize) wiki repo
        if: steps.wiki_enabled.outputs.has_wiki == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if git clone "$REMOTE" wiki-repo 2>/tmp/clone.err; then
            echo "cloned existing wiki repo"
          else
            cat /tmp/clone.err
            echo "wiki repo is empty or not yet enabled; initializing"
            rm -rf wiki-repo
            mkdir wiki-repo
            cd wiki-repo
            git init -q
            git checkout -q -b master
            cd ..
          fi

      - name: Mirror wiki/ pages into the wiki repo
        if: steps.wiki_enabled.outputs.has_wiki == 'true'
        run: |
          set -e
          rsync -av --delete --exclude='.git' main/wiki/ wiki-repo/

      - name: Commit and push if changed
        if: steps.wiki_enabled.outputs.has_wiki == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no wiki changes to sync"
            exit 0
          fi
          git commit -q -m "Sync wiki from ${{ github.repository }}@${GITHUB_SHA}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          BRANCH=$(git branch --show-current)
          git push "$REMOTE" "HEAD:$BRANCH"
