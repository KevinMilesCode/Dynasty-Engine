name: FAQ drafter

# When a Discussions Q&A thread is marked answered, ask Claude to fold the
# accepted answer into wiki/ and open it as a PR for a human to review and
# merge. Nothing here publishes automatically — see wiki-sync.yml for the
# (non-AI, deterministic) step that mirrors merged wiki/ changes to the
# actual GitHub Wiki.
on:
  discussion:
    types: [answered]

permissions:
  contents: write
  pull-requests: write
  discussions: read

jobs:
  draft-faq:
    if: github.event.discussion.category.slug == 'q-a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch discussion + accepted answer
        id: discussion
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.discussion.number
            const query = `query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){
                discussion(number:$number){
                  title body url
                  answer { body url author { login } }
                }
              }
            }`
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              name: context.repo.repo,
              number,
            })
            const d = result.repository.discussion
            if (!d.answer) {
              core.setFailed('Discussion has no accepted answer; nothing to draft.')
              return
            }
            require('fs').writeFileSync('discussion.json', JSON.stringify(d, null, 2))
            core.setOutput('number', String(number))

      - name: Draft wiki update with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/faq-drafter.mjs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -f /tmp/faq-drafter-changed ]; then
            echo "No wiki changes proposed; nothing to do."
            exit 0
          fi
          BRANCH="faq/discussion-${{ steps.discussion.outputs.number }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add wiki
          git commit -F /tmp/faq-drafter-title.txt
          git push origin "$BRANCH"
          gh pr create \
            --title "$(cat /tmp/faq-drafter-title.txt)" \
            --body-file /tmp/faq-drafter-body.txt \
            --label faq-auto \
            --base main \
            --head "$BRANCH"
