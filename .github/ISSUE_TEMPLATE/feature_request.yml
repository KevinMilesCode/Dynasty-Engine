name: Feature request
description: Suggest an enhancement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question instead of a suggestion? Please use [Discussions → Q&A](../../discussions/categories/q-a)
        instead; it keeps this tracker for actionable requests.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the tool doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Rough ideas are fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
